<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Nur Blocker - App Presentation</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#157947",
                        "background-light": "#f6f8f7",
                        "background-dark": "#122019",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'glow': '0 0 60px -15px rgba(21, 121, 71, 0.3)',
                    }
                },
            },
        }
    </script>
    <style>
        .gold-gradient-text {
            background: linear-gradient(135deg, #D4AF37 0%, #F3E5AB 50%, #B4941F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gold-stroke {
            stroke: #D4AF37;
        }

        .gold-fill {
            fill: #D4AF37;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="antialiased">
    <div
        class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-hidden font-display selection:bg-primary/20 selection:text-primary">
        <!-- Subtle Background Pattern (Abstract Geometric) -->
        <div class="absolute inset-0 opacity-[0.03] dark:opacity-[0.05] pointer-events-none"
            data-alt="Minimalist dot pattern background for texture"
            style="background-image: radial-gradient(#157947 1px, transparent 1px); background-size: 32px 32px;">
        </div>
        <!-- Main Content Area: Centered -->
        <main class="flex-grow flex flex-col items-center justify-center relative z-10 w-full max-w-md mx-auto px-6">
            <!-- Logo Composition -->
            <div class="relative mb-10 group cursor-default">
                <!-- Ambient Glow behind the shield -->
                <div
                    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-40 h-40 bg-primary/20 rounded-full blur-3xl">
                </div>
                <!-- The Shield Icon -->
                <!-- Deep Emerald Green Body with Gold Stroke -->
                <div
                    class="relative w-48 h-48 drop-shadow-2xl transition-transform duration-700 ease-out group-hover:scale-[1.02]">
                    <svg class="w-full h-full" viewbox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <lineargradient id="shieldGradient" x1="0%" x2="100%" y1="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#1a8f55;stop-opacity:1"></stop>
                                <stop offset="100%" style="stop-color:#0e5230;stop-opacity:1"></stop>
                            </lineargradient>
                        </defs>
                        <!-- Shield Base Shape -->
                        <path class="shadow-lg"
                            d="M50 5 L10 20 V 50 C10 80 25 100 50 115 C75 100 90 80 90 50 V 20 L50 5 Z"
                            fill="url(#shieldGradient)" stroke="#D4AF37" stroke-linejoin="round" stroke-width="1.5">
                        </path>
                        <!-- Inner Decorative Gold Line (Subtle) -->
                        <path d="M50 12 L18 24 V 50 C18 75 30 90 50 102 C70 90 82 75 82 50 V 24 L50 12 Z" fill="none"
                            stroke="#D4AF37" stroke-opacity="0.5" stroke-width="0.5"></path>
                        <!-- Abstract Calligraphy 'Nur' Symbol -->
                        <!-- Represents light/flow within the shield -->
                        <g transform="translate(30, 40) scale(0.4)">
                            <!-- Stylized Arabic-inspired curve -->
                            <path
                                d="M90 10 C 80 10, 70 30, 50 30 C 30 30, 20 10, 10 20 C -5 35, 10 80, 50 80 C 90 80, 100 40, 100 20"
                                fill="none" stroke="#D4AF37" stroke-linecap="round" stroke-width="8"></path>
                            <!-- The 'Dot' of the letter -->
                            <circle cx="50" cy="0" fill="#D4AF37" r="6"></circle>
                        </g>
                    </svg>
                </div>
            </div>
            <!-- Typography Section -->
            <div class="flex flex-col items-center gap-3 text-center">
                <h1 class="text-4xl font-extrabold tracking-tight text-primary dark:text-white leading-tight">
                    Nur Blocker
                </h1>
                <div class="flex items-center gap-3">
                    <div class="h-[1px] w-8 bg-[#D4AF37]/50"></div>
                    <p class="text-[#D4AF37] dark:text-[#E5C558] text-sm font-semibold tracking-[0.2em] uppercase">
                        Secure. Private. Local.
                    </p>
                    <div class="h-[1px] w-8 bg-[#D4AF37]/50"></div>
                </div>
            </div>
        </main>
        <!-- Footer Info -->
        <footer class="w-full p-8 flex flex-col items-center justify-center gap-4 relative z-10">
            <!-- Security Badge -->
            <div
                class="flex items-center gap-2 px-4 py-2 bg-white/50 dark:bg-background-dark/50 border border-primary/10 dark:border-primary/20 rounded-full backdrop-blur-sm">
                <span class="material-symbols-outlined text-primary text-[18px]">verified_user</span>
                <span class="text-primary/80 dark:text-primary/60 text-xs font-medium">Offline Protection Active</span>
            </div>
            <!-- Version -->
            <p class="text-primary/40 dark:text-gray-500 text-[10px] font-medium tracking-wide">
                v1.0.0
            </p>
        </footer>
    </div>
</body>

</html>
