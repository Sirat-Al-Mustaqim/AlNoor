---
name: Auto Version Bump

'on':
  push:
    branches:
      - develop

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/exec@6 \
            @semantic-release/release-notes-generator@13

      - name: Check if version bump commit
        id: check_skip
        run: |
          # Skip if the last commit is a version bump to prevent loops
          LAST_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_MSG" == "chore(release):"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Last commit was a version bump, skipping..."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run semantic-release
        if: steps.check_skip.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          npx semantic-release

      - name: Extract version info for summary
        if: steps.check_skip.outputs.skip == 'false'
        id: version_info
        run: |
          # Get the latest commit message to extract version
          LAST_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_MSG" == "chore(release):"* ]]; then
            # Extract version from commit message
            VERSION=$(echo "$LAST_MSG" | grep -oP 'chore\(release\): \K[0-9]+\.[0-9]+\.[0-9]+')
            
            # Extract VERSION_CODE from gradle.properties
            VERSION_CODE=$(grep -oP '^VERSION_CODE=\K\d+' gradle.properties)
            
            echo "new_version=$VERSION" >> $GITHUB_OUTPUT
            echo "new_version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        if: |
          steps.check_skip.outputs.skip == 'false' &&
          steps.version_info.outputs.released == 'true'
        run: |
          echo "### Version Bump Summary :rocket:" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **New versionName:** ${{ steps.version_info.outputs.new_version }}" \
            >> $GITHUB_STEP_SUMMARY
          echo "- **New versionCode:** ${{ steps.version_info.outputs.new_version_code }}" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Changes committed and pushed to \`develop\` branch" \
            >> $GITHUB_STEP_SUMMARY
