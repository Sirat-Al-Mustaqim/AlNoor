---
name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js for semantic-release
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/exec \
            @semantic-release/github \
            @semantic-release/git

      - name: Check if version bump commit
        id: check_skip
        run: |
          # Skip if the last commit is a version bump to prevent loops
          LAST_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_MSG" == "chore(release):"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Last commit was a version bump, skipping..."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        if: steps.check_skip.outputs.skip == 'false'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > app/keystore.jks
          echo "✓ Keystore decoded"

      - name: Set up JDK 17
        if: steps.check_skip.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: steps.check_skip.outputs.skip == 'false'
        run: chmod +x gradlew

      - name: Verify Identity
        run: |
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" https://api.github.com/user | grep login

      - name: Run semantic-release
        if: steps.check_skip.outputs.skip == 'false'
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          npx semantic-release

      - name: Summary
        if: steps.check_skip.outputs.skip == 'false'
        run: |
          # Extract VERSION_NAME from gradle.properties (updated by semantic-release)
          VERSION_NAME=$(grep -oP '^VERSION_NAME=\K[^\s]+' gradle.properties)
          VERSION_CODE=$(grep -oP '^VERSION_CODE=\K\d+' gradle.properties)
          
          echo "### Release Summary :rocket:" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION_NAME" \
            >> $GITHUB_STEP_SUMMARY
          echo "- **Version Code:** $VERSION_CODE" \
            >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Release published for v$VERSION_NAME" \
            >> $GITHUB_STEP_SUMMARY
          echo "✓ Version bumped and committed to repository" \
            >> $GITHUB_STEP_SUMMARY