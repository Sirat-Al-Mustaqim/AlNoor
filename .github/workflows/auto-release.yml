name: auto-release

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.drafter.outputs.tag_name }}
      name: ${{ steps.drafter.outputs.name }}
      upload-url: ${{ steps.drafter.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Draft Release
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          publish: false
          prerelease: false
          config-name: auto-release.yml
          disable-releaser: ${{ github.ref_name != 'develop' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

  build-and-release:
    runs-on: ubuntu-latest
    needs: draft-release
    if: github.ref_name == 'develop'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Extract Version
        id: version
        run: |
          # Extract version from tag name (remove 'v' prefix)
          VERSION="${{ needs.draft-release.outputs.tag-name }}"
          VERSION_NUMBER="${VERSION#v}"
          echo "version=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION_NUMBER"

      - name: Update gradle.properties
        run: |
          chmod +x .github/scripts/update-version.sh
          .github/scripts/update-version.sh "${{ steps.version.outputs.version }}"
          
      - name: Commit Version Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > app/keystore.jks


      - name: Build Release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x .github/scripts/build-and-package-apk.sh
          .github/scripts/build-and-package-apk.sh "${{ steps.version.outputs.version }}"

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          upload_url: ${{ needs.draft-release.outputs.upload-url }}
          asset_path: ./al-noor-v${{ steps.version.outputs.version }}.apk
          asset_name: al-noor-v${{ steps.version.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Update provisioning
        run: |
          # Calculate APK checksum (SHA-256, URL-safe base64)
          APK_FILE="./al-noor-v${{ steps.version.outputs.version }}.apk"
          CHECKSUM=$(shasum -a 256 "$APK_FILE" | awk '{print $1}' | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
          
          # Set download URL pointing to the release
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/al-noor-v${{ steps.version.outputs.version }}.apk"
          
          echo "📦 APK Checksum: $CHECKSUM"
          echo "🔗 Download URL: $DOWNLOAD_URL"
          
          # Update provisioning.json using jq
          jq --arg url "$DOWNLOAD_URL" --arg checksum "$CHECKSUM" \
            '."android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION" = $url | ."android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM" = $checksum' \
            docs/provisioning.json > docs/provisioning.json.tmp && mv docs/provisioning.json.tmp docs/provisioning.json
          
          echo "✅ Updated provisioning.json:"
          cat docs/provisioning.json
          
          # Generate QR code from provisioning.json
          sudo apt-get install -y qrencode
          qrencode -o docs/provisioning-qr.png -s 10 -l H < docs/provisioning.json
          echo "✅ Generated provisioning-qr.png"

      - name: Commit provisioning Update
        run: |
          git add docs/provisioning.json docs/provisioning-qr.png
          git diff --staged --quiet || git commit -m "chore: update provisioning for ${{ steps.version.outputs.tag }} [skip ci]"
          git push

